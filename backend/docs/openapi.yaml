openapi: 3.0.0
info:
  title: Sistema de Doações SANEM
  version: 2.0.0
  description: |
    Documentação da API RESTful para o sistema de gerenciamento de doações da SANEM.
servers:
  - url: http://localhost:{port}
    description: Servidor de Desenvolvimento Local
    variables:
      port:
        default: "3000"
        description: Porta configurada da aplicação

paths:
  /:
    get:
      summary: Healthcheck simples
      description: |
        Retorna um objeto com "Hello": "World" para indicar que a API está de pé.
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  Hello:
                    type: string
                    example: World

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@sanem.com
                senha:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login bem-sucedido!
                  token:
                    type: string
                  voluntario:
                    $ref: '#/components/schemas/Voluntario'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /tipos:
    get:
      tags: [Tipos]
      summary: Lista todos os tipos de itens
      responses:
        '200':
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tipo'
        '500':
          description: Erro ao buscar os tipos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      tags: [Tipos]
      summary: Cria um novo tipo de item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao]
              properties:
                descricao:
                  type: string
                  example: Brinquedo
      responses:
        '201':
          description: Tipo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tipo'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Tipo já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /tipos/{id}:
    get:
      tags: [Tipos]
      summary: Busca um tipo por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tipo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tipo'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    put:
      tags: [Tipos]
      summary: Atualiza um tipo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao]
              properties:
                descricao:
                  type: string
                  example: Calçado Esportivo
      responses:
        '200':
          description: Tipo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tipo'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Já existe outro tipo com essa descrição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags: [Tipos]
      summary: Remove um tipo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removido com sucesso
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Tipo em uso e não pode ser removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /tamanhos:
    get:
      tags: [Tamanhos]
      summary: Lista todos os tamanhos
      parameters:
        - in: query
          name: tipoId
          schema:
            type: integer
          description: Filtra por tipo
      responses:
        '200':
          description: Lista de tamanhos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tamanho'
        '500':
          description: Erro ao buscar tamanhos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      tags: [Tamanhos]
      summary: Cria um novo tamanho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao, tipoId]
              properties:
                descricao:
                  type: string
                  example: 42
                tipoId:
                  type: integer
                  example: 2
      responses:
        '201':
          description: Tamanho criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tamanho'
        '400':
          description: Erro de validação ou tipo inexistente
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Tamanho já existe para o tipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /tamanhos/{id}:
    get:
      tags: [Tamanhos]
      summary: Busca um tamanho por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tamanho encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tamanho'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    put:
      tags: [Tamanhos]
      summary: Atualiza um tamanho
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao, tipoId]
              properties:
                descricao:
                  type: string
                  example: GG
                tipoId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Tamanho atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tamanho'
        '400':
          description: Erro de validação ou lógica
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Combinação já existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags: [Tamanhos]
      summary: Remove um tamanho
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removido com sucesso
        '400':
          description: Em uso e não pode ser removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /condicoes:
    get:
      tags: [Condições]
      summary: Lista todas as condições
      responses:
        '200':
          description: Lista de condições
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Condicao'
        '500':
          description: Erro ao buscar condições
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      tags: [Condições]
      summary: Cria uma nova condição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao]
              properties:
                descricao:
                  type: string
                  example: Novo
      responses:
        '201':
          description: Condição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Condicao'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Condição já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /condicoes/{id}:
    get:
      tags: [Condições]
      summary: Busca uma condição por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Condição encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Condicao'
        '404':
          description: Não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    put:
      tags: [Condições]
      summary: Atualiza uma condição
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descricao]
              properties:
                descricao:
                  type: string
                  example: Usado - Bom estado
      responses:
        '200':
          description: Condição atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Condicao'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Descrição já usada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags: [Condições]
      summary: Remove uma condição
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removida com sucesso
        '400':
          description: Em uso e não pode ser removida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /beneficiarios:
    get:
      tags: [Beneficiários]
      summary: Lista todos os beneficiários
      responses:
        '200':
          description: Lista de beneficiários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Beneficiario'
        '500':
          description: Erro ao buscar beneficiários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      tags: [Beneficiários]
      summary: Cria um novo beneficiário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiarioInput'
      responses:
        '201':
          description: Beneficiário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiario'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: CPF já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /beneficiarios/{id}:
    get:
      tags: [Beneficiários]
      summary: Busca um beneficiário por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Beneficiário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiario'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    put:
      tags: [Beneficiários]
      summary: Atualiza um beneficiário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiarioInput'
      responses:
        '200':
          description: Beneficiário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiario'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: CPF já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags: [Beneficiários]
      summary: Remove um beneficiário
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removido com sucesso
        '400':
          description: Beneficiário em uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /doacoes:
    get:
      tags: [Doações]
      summary: Lista todas as doações
      responses:
        '200':
          description: Lista de doações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doacao'
        '500':
          description: Erro ao buscar doações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      tags: [Doações]
      summary: Cria uma nova doação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoacaoInput'
      responses:
        '201':
          description: Doação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doacao'
        '400':
          description: Erro de validação ou dados inconsistentes
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Algum item referenciado não existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /doacoes/{id}:
    get:
      tags: [Doações]
      summary: Busca uma doação por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Doação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doacao'
        '404':
          description: Não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags: [Doações]
      summary: Remove uma doação
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removida com sucesso
        '404':
          description: Não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ValidationIssue:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: array
          items:
            type: string
        expected:
          type: string
          nullable: true
        received:
          type: string
          nullable: true
    ValidationErrorResponse:
      type: object
      properties:
        Erro de Validação:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    Voluntario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        admin:
          type: boolean
        endereco:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Tipo:
      type: object
      properties:
        id:
          type: integer
        descricao:
          type: string
    Tamanho:
      type: object
      properties:
        id:
          type: integer
        descricao:
          type: string
        tipoId:
          type: integer
    Condicao:
      type: object
      properties:
        id:
          type: integer
        descricao:
          type: string
    Beneficiario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cpf:
          type: string
        telefone:
          type: string
          nullable: true
        endereco:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BeneficiarioInput:
      type: object
      required: [nome, cpf]
      properties:
        nome:
          type: string
          example: Jose da Silva
        cpf:
          type: string
          example: '11122233344'
        telefone:
          type: string
          example: '11912345678'
          nullable: true
        endereco:
          type: string
          example: 'Rua das Flores, 123'
          nullable: true
    ItemCatalog:
      type: object
      properties:
        id:
          type: integer
        quantidadeEstoque:
          type: integer
        condicaoId:
          type: integer
        tipoId:
          type: integer
        tamanhoId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ItemDoacao:
      type: object
      properties:
        doacaoId:
          type: integer
        itemId:
          type: integer
        quantidade:
          type: number
    ItemDoacaoDetalhado:
      allOf:
        - $ref: '#/components/schemas/ItemDoacao'
        - type: object
          properties:
            id:
              type: integer
            item:
              $ref: '#/components/schemas/ItemCatalog'
    Doacao:
      type: object
      properties:
        id:
          type: integer
        voluntarioId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemDoacaoDetalhado'
    DoacaoInput:
      type: object
      required: [voluntarioId, itens]
      properties:
        voluntarioId:
          type: integer
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [tipoId, tamanhoId, condicaoId, quantidade]
            properties:
              tipoId:
                type: integer
              tamanhoId:
                type: integer
              condicaoId:
                type: integer
              quantidade:
                type: number
